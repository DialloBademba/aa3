name: Python CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v6

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Vérifier la syntaxe
        run: python -m py_compile app.py

      - name: Exécuter le programme
        run: python app.py
        env:
          APP_NAME: AA3_CI
          APP_PORT: 8080
          DB_USER: user
          DB_PASSWORD: pwd_secret